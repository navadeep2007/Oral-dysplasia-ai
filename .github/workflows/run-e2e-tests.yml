name: Run E2E Selenium Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install selenium openpyxl requests

      - name: Set up Chrome Browser
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Start FastAPI Backend
        run: |
          # Start uvicorn in the background from the backend directory
          cd backend
          python -m uvicorn app.main:app --port 8000 &
          
          # Wait for backend to be healthy
          echo "Waiting for backend to start..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8000/health > /dev/null; then
              echo "Backend is healthy!"
              break
            fi
            sleep 1
          done

      - name: Run E2E Selenium Tests
        continue-on-error: true
        run: |
          python backend/run_selenium_tests.py || true

      - name: Upload All Test Reports Bundle
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-test-reports-bundle
          path: |
            *.xlsx
            appium_tests/*.xlsx
            automated_test/*.xlsx
            automated_test/*.csv
            automated_test/*.html
            backend/*.xlsx

      - name: Upload Selenium Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-test-reports
          path: backend/selenium_test_results*.xlsx

      - name: Upload Appium Mobile Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appium-test-reports
          path: appium_tests/appium_test_results.xlsx

      - name: Upload DAST Security & Vulnerability Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dast-security-reports
          path: |
            DAST_Security_Report.xlsx
            automated_test/DAST_Security_Report.*
            automated_test/DAST_*.csv

      - name: Upload Load & Performance Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-test-reports
          path: |
            Load_Test_Report.xlsx
            automated_test/Load_Test_Report.xlsx

      - name: Upload Combined Executive Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combined-test-reports
          path: combined_test_report*.xlsx
